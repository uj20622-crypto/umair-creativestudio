<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Umair Creative Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230a0a0c%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 fill=%22%233b82f6%22 font-family=%22sans-serif%22 font-weight=%22800%22 text-anchor=%22middle%22>U</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="brand"><span class="brand-mark">U</span><span>Umair<small>CREATIVE STUDIO</small></span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="portfolio.html" class="active">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="contact.html" class="btn btn-primary btn-sm">Start a Project</a>
      <button class="nav-burger" aria-label="Open menu">☰</button>
    </div>
  </div>
</header>

<div class="mnav" style="display:none;position:fixed;inset:0;background:#0a0a0c;z-index:100;flex-direction:column;padding:30px;">
  <button class="mnav-close" style="align-self:flex-end;background:none;border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 10px;">✕</button>
  <div style="display:flex;flex-direction:column;gap:20px;margin-top:40px;font-size:20px;">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<section class="section-tight" style="padding-top:56px;">
  <div class="container">
    <div class="eyebrow">Portfolio</div>
    <h1 class="display-1">Work that earns<br>the click. The buy.</h1>
  </div>
</section>

<section class="section" style="padding-top:20px;">
  <div class="container">
    <div class="filter-bar" id="filterBar">
      <button data-filter="all" class="active">All Work</button>
      <button data-filter="thumbnail">YouTube Thumbnails</button>
      <button data-filter="aplus">Amazon A+ Content</button>
      <button data-filter="product">Product Images</button>
      <button data-filter="logo">Logos & Identity</button>
      <button data-filter="packaging">Packaging</button>
      <button data-filter="social">Social Media</button>
    </div>
    <div class="gallery-grid" id="portfolioGrid"></div>
  </div>
</section>

<section class="section cta-band">
  <div class="container cta-panel">
    <div>
      <div class="eyebrow">Like What You See?</div>
      <h2 class="display-2">Let's make your<br>next project stand out.</h2>
    </div>
    <div>
      <a href="contact.html" class="btn btn-primary">Start a Project</a>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2026 Umair Creative Studio. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
document.querySelector('.nav-burger').addEventListener('click', ()=> document.querySelector('.mnav').style.display='flex');
document.querySelector('.mnav-close').addEventListener('click', ()=> document.querySelector('.mnav').style.display='none');
</script>
</body>
</html>
